<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Monarch 3D</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game-shell">
    <div id="hud">
      <div class="row">
        <span class="icon">❤️</span>
        <div class="bar"><div id="hp-bar" class="fill hp"></div></div>
        <span id="hp-text" class="num">1000 / 1000</span>
      </div>
      <div class="row">
        <span class="icon">⚡</span>
        <div class="bar"><div id="fruit-bar" class="fill fruit"></div></div>
        <span id="fruit-text" class="num">100</span>
      </div>
      <div class="row">
        <span class="icon">👑</span>
        <div class="bar"><div id="v4-bar" class="fill v4"></div></div>
        <span id="v4-text" class="num">0</span>
      </div>
      <div class="row">
        <span class="icon">🩸</span>
        <div class="bar"><div id="ult-bar" class="fill ult"></div></div>
        <span id="ult-text" class="num">0</span>
      </div>
    </div>

    <div id="mode-label">SWORD</div>
    <div id="chapter-label">CHAPTER 1</div>

    <div id="dialogue" class="hidden">
      <div id="dialogue-text">Choose your power.</div>
    </div>

    <div id="hotbar">
      <button class="slot" data-mode="sanguine">🩸<span>1</span></button>
      <button class="slot" data-mode="rumble">⚡<span>2</span></button>
      <button class="slot active" data-mode="sword">🗡️<span>3</span></button>
      <button class="slot" data-mode="v4">👼<span>4</span></button>
    </div>

    <div id="start-screen" class="screen">
      <div class="title">CELESTIAL MONARCH</div>
      <div class="subtitle">3D Fantasy Browser Prototype</div>
      <button id="start-btn" class="big-btn">START ADVENTURE</button>
    </div>

    <div id="end-screen" class="screen hidden">
      <div class="title small">VICTORY</div>
      <div class="subtitle">The cursed path ends here.</div>
      <button id="restart-btn" class="big-btn alt">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
